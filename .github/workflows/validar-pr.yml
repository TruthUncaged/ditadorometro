name: Validar pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PRs abertos por agentes só podem alterar o registro.
      - name: Restringir arquivos alterados por agentes
        if: startsWith(github.head_ref, 'agente/')
        run: |
          outros=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -v '^src/data/news\.js$' || true)
          if [ -n "$outros" ]; then
            echo "::error::O agente alterou arquivos fora do registro:"
            echo "$outros"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validar registro
        run: node scripts/validate.mjs

      - run: npm run build
