name: Atualização periódica do registro

# 1. pesquisar:   um agente revisa as fontes, busca novas ocorrências e propõe
#                 mudanças em db/ocorrencias.json.
# 2. verificar:   três agentes independentes (contextos separados, focos
#                 diferentes) votam em cada mudança.
# 3. consolidar:  só entram as mudanças com 2 aprovações, nenhum veto e pontos
#                 confirmados; o resultado é validado e enviado direto à main.
# 4. publicar:    o site é reconstruído e publicado no GitHub Pages.

on:
  schedule:
    - cron: '0 9 */3 * *' # 06:00 em Brasília, a cada 3 dias (dias 1, 4, 7… de cada mês): atualização regular
    - cron: '0 10 * * 0' # domingo, 07:00 em Brasília: varredura de rebalanceamento (só Executivo, Congresso, FA, estados, partidos, plataformas)
  workflow_dispatch:
    inputs:
      modo:
        description: 'regular ou rebalanceamento'
        default: regular
        type: choice
        options: [regular, rebalanceamento]

permissions:
  contents: read

concurrency:
  group: atualizacao-diaria
  cancel-in-progress: false

jobs:
  pesquisar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Só leitura: o agente recebe github_token explícito, então não precisa de id-token (OIDC).
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.count != '0' }}
      score: ${{ steps.before.outputs.score }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Preparar
        id: before
        env:
          MODO_INPUT: ${{ inputs.modo }}
          AGENDA: ${{ github.event.schedule }}
        run: |
          echo "HOJE=$(TZ=America/Sao_Paulo date +%F)" >> "$GITHUB_ENV"
          if [ "$MODO_INPUT" = "rebalanceamento" ] || [ "$AGENDA" = "0 10 * * 0" ]; then modo=rebalanceamento; else modo=regular; fi
          echo "MODO=$modo" >> "$GITHUB_ENV"
          echo "score=$(node scripts/validate.mjs --score)" >> "$GITHUB_OUTPUT"
          mkdir -p .agent
          git show HEAD:db/ocorrencias.json > .agent/base-register.json
          # Pistas determinísticas (feeds oficiais, veículos por linha editorial, buscas por código) e
          # estatística de cobertura, para o pesquisador priorizar esferas sub-representadas e para os
          # verificadores conferirem o que estava disponível e não entrou.
          node scripts/collect-news.mjs .agent/candidatos.md 7 || echo "::warning::coleta de candidatas falhou"
          node scripts/cobertura.mjs .agent/cobertura.md 90

      # Escrita restrita a dois arquivos: o agente não consegue alterar scripts, o validador
      # ou node_modules antes de rodar os comandos permitidos. Na ferramenta do agente, uma regra
      # Edit(caminho) cobre as ferramentas Edit e Write; regras Write(caminho) nunca casam.
      - name: Agente pesquisador
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Hoje é ${{ env.HOJE }}. Modo desta execução: ${{ env.MODO }} (se for "rebalanceamento", esta é uma execução de rebalanceamento, conforme o Passo 2).
            Siga integralmente as instruções de .github/prompts/atualizar-registro.md.
          # O pesquisador é o único passo que decide o que entra; usa o modelo mais capaz.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 160
            --allowedTools "Read,Glob,Grep,WebSearch,WebFetch,Edit(db/ocorrencias.json),Edit(.agent/relatorio.md),Bash(node scripts/validate.mjs),Bash(npm run build)"

      # O pesquisador só pode escrever no registro e no relatório (regras de permissão
      # acima); esta etapa é a segunda barreira, caso alguma escrita passe.
      - name: Descartar alterações fora do registro
        run: git checkout -- . ':!db/ocorrencias.json'

      - name: Validar proposta
        run: |
          node scripts/validate.mjs
          npm run build

      - name: Listar mudanças
        id: diff
        run: |
          count=$(node scripts/diff-news.mjs .agent/base-register.json db/ocorrencias.json .agent)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "::notice::$count mudança(s) proposta(s)"
          cp db/ocorrencias.json .agent/cand-register.json
          [ -f .agent/relatorio.md ] || echo "O pesquisador não gerou relatório." > .agent/relatorio.md

      - uses: actions/upload-artifact@v4
        with:
          name: proposta
          path: .agent/
          include-hidden-files: true
          retention-days: 14

  verificar:
    needs: pesquisar
    if: needs.pesquisar.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - foco: fontes
            model: claude-sonnet-5-5
          - foco: classificacao
            model: claude-opus-5-5
          - foco: linguagem
            model: claude-sonnet-5-5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: proposta
          path: .agent

      - name: Aplicar proposta para leitura
        run: cp .agent/cand-register.json db/ocorrencias.json

      - name: Agente verificador (${{ matrix.foco }})
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Você é o verificador independente com foco em "${{ matrix.foco }}".
            Siga integralmente as instruções de .github/prompts/verificar-registro.md.
            Grave o veredito em .agent/veredito-${{ matrix.foco }}.json.
          claude_args: |
            --model ${{ matrix.model }}
            --max-turns 80
            --allowedTools "Read,Glob,Grep,WebSearch,WebFetch,Edit(.agent/veredito-${{ matrix.foco }}.json)"

      # Só o veredito sai deste job; qualquer outra alteração é descartada.
      - uses: actions/upload-artifact@v4
        with:
          name: veredito-${{ matrix.foco }}
          path: .agent/veredito-${{ matrix.foco }}.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  consolidar:
    needs: [pesquisar, verificar]
    # Roda mesmo se um verificador falhar: a falta de voto conta como rejeição.
    if: always() && needs.pesquisar.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Mesmo commit que o pesquisador usou como base.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: proposta
          path: .agent

      - uses: actions/download-artifact@v4
        with:
          pattern: veredito-*
          path: .agent/vereditos
          merge-multiple: true

      - name: Consolidar votos
        run: |
          echo "HOJE=$(TZ=America/Sao_Paulo date +%F)" >> "$GITHUB_ENV"
          node scripts/apply-verdicts.mjs .agent/base-register.json .agent/cand-register.json .agent/vereditos
          cat .agent/consolidacao.md >> "$GITHUB_STEP_SUMMARY"
          # Fila do pesquisador e omissões dos verificadores, para a próxima execução.
          node scripts/pendencias.mjs .agent/relatorio.md .agent/vereditos data/pendencias.md

      - name: Validar resultado
        run: |
          node scripts/validate.mjs
          npm run build

      - name: Commit na main
        id: commit
        run: |
          git add data/pendencias.md
          if git diff --quiet -- db/ocorrencias.json && git diff --cached --quiet -- data/pendencias.md; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nenhuma mudança aprovada pelos verificadores e nenhuma pendência nova."
            exit 0
          fi
          after=$(node scripts/validate.mjs --score)
          {
            if git diff --quiet -- db/ocorrencias.json; then
              echo "Pendências: fila e omissões de $HOJE (registro inalterado, índice $after)"
            else
              echo "Registro: atualização de $HOJE (índice ${{ needs.pesquisar.outputs.score }} → $after)"
            fi
            echo
            cat .agent/consolidacao.md
            echo
            echo "## Relatório do pesquisador"
            echo
            cat .agent/relatorio.md
          } > .agent/commit.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/ocorrencias.json data/pendencias.md
          git commit -F .agent/commit.txt
          # Se a main avançou, rebase; um conflito interrompe sem sobrescrever nada.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "committed=true" >> "$GITHUB_OUTPUT"

  # Commits feitos com GITHUB_TOKEN não disparam outros workflows,
  # então a publicação chama o deploy diretamente.
  publicar:
    needs: consolidar
    if: needs.consolidar.outputs.committed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
